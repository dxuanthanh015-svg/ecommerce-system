<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradient chuyển màu cho Icon -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <!-- Hiệu ứng bóng mờ -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group Icon: Kết hợp Túi mua sắm + Trình duyệt Web + Tốc độ -->
  <g transform="translate(10, 10)">
    <!-- Khung trình duyệt / Túi hàng (Outer Frame) -->
    <rect x="10" y="25" width="70" height="65" rx="16" fill="url(#primary-grad)" filter="url(#soft-shadow)" />
    
    <!-- Quai túi mua sắm (Shopping Bag Handle) -->
    <path d="M 32 25 C 32 12, 58 12, 58 25" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tia chớp / Nhấp chuột (Tượng trưng cho mua sắm nhanh & công nghệ) -->
    <path d="M 50 38 L 32 60 L 44 60 L 40 80 L 58 58 L 46 58 Z" fill="#FFFFFF" />
    
    <!-- Chấm thông báo / Deal mới (Badge) -->
    <circle cx="72" cy="25" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typography: Tên thương hiệu -->
  <g transform="translate(115, 72)">
    <!-- Phần "Nex" -->
    <text font-family="Inter, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-1">
      Nex
    </text>
    <!-- Phần "Cart" với màu Gradient -->
    <text x="88" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="url(#primary-grad)" letter-spacing="-1">
      Cart
    </text>
    <!-- Dấu chấm đại diện cho tên miền .com / Tech -->
    <circle cx="192" cy="-8" r="5" fill="#06B6D4" />
  </g>

  <!-- Tagline phía dưới -->
  <text x="117" y="93" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="3">
    SMART E-COMMERCE
  </text>
</svg>
