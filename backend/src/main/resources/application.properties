spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

server.port=${PORT:2908}
server.servlet.context-path=/nex-cart

# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/ecommerce_system_web?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===== GOOGLE OAUTH2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.user-info-uri=${GOOGLE_USER_INFO_URI}
spring.security.oauth2.client.registration.google.token-uri=${GOOGLE_TOKEN_URI}
spring.security.oauth2.client.registration.google.scope=email,profile
# ===== FRONTEND =====
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}

# Fixed platform administrator; configure ADMIN_EMAIL and ADMIN_PASSWORD in env.properties/environment.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:Platform}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}

# ===== FILE UPLOAD =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== SWAGGER =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== MAIL =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}


app.s3.bucket=${S3_BUCKET}
app.s3.region=${AWS_REGION}
app.s3.cloudfront-url=${CLOUDFRONT_URL}

# ===== GROQ AI ASSISTANT =====
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
